<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    .notice { padding: .75rem 1rem; border-radius: .4rem; background: #fff4e5; border: 1px solid #f0b76a; }
    .notice.error { background: #fdecec; border-color: #e58a8a; }
    .topic { display: inline-block; padding: .1rem .5rem; border-radius: .3rem; background: #e8f0fe; font-weight: 600; }
    .hint { color: #666; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>

  <div id="status" aria-live="polite"></div>

  <section id="ready" hidden>
    <h2>Результат</h2>
    <p>Тема: <span id="topic" class="topic"></span></p>
    <label for="draft">Черновик ответа</label>
    <textarea id="draft" rows="6"></textarea>
    <p class="hint">Это черновик от AI. Проверьте и при необходимости отредактируйте перед отправкой клиенту.</p>
  </section>

  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены и стоимость", other: "Другое" };

    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const status = document.querySelector("#status");
    const ready = document.querySelector("#ready");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    function showNotice(message, kind = "warning") {
      status.innerHTML = "";
      const box = document.createElement("p");
      box.className = kind === "error" ? "notice error" : "notice";
      box.textContent = message;
      status.append(box);
    }

    function clearResult() {
      ready.hidden = true;
      topic.textContent = "";
      draft.value = "";
      status.innerHTML = "";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      clearResult();
      button.disabled = true;
      status.textContent = "Разбираем заявку…";
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: document.querySelector("#message").value }),
        });
        const data = await reply.json();
        status.textContent = "";
        if (data.status === "ready") {
          topic.textContent = TOPIC_LABELS[data.topic] ?? data.topic;
          draft.value = data.draft;
          ready.hidden = false;
        } else if (data.status === "manual_review") {
          showNotice("AI не смог надёжно разобрать заявку. Определите тему и подготовьте ответ вручную.");
        } else if (data.status === "invalid_input") {
          showNotice("Введите текст заявки.", "error");
        } else {
          showNotice("Ошибка сервера. Попробуйте ещё раз.", "error");
        }
      } catch {
        showNotice("Не удалось связаться с сервером. Попробуйте ещё раз.", "error");
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
